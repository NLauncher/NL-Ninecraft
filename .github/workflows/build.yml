name: Build Ninecraft

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-linux-x86:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y git make cmake unzip python3-jinja2 zenity gcc-i686-linux-gnu g++-i686-linux-gnu libopenal-dev:i386 libx11-dev:i386 libxrandr-dev:i386 libxinerama-dev:i386 libxcursor-dev:i386 libxi-dev:i386 libgl-dev:i386 libwayland-dev:i386 libpulse-dev:i386 libxkbcommon-dev:i386 libegl-dev:i386 libasound2-dev:i386
    - name: Build
      run: |
        mkdir -p build-i686
        cd build-i686
        cmake -DCMAKE_TOOLCHAIN_FILE=../cmake/i686_toolchain.cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        make -j$(nproc)
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ninecraft-linux-i686
        path: build-i686/ninecraft/ninecraft

  build-linux-armhf:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    steps:
    - name: Install Git
      run: |
        apt-get update
        apt-get install -y git ca-certificates
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install Dependencies
      run: |
        dpkg --add-architecture armhf
        apt-get update
        apt-get install -y make cmake unzip python3-jinja2 zenity gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libopenal-dev:armhf libx11-dev:armhf libxrandr-dev:armhf libxinerama-dev:armhf libxcursor-dev:armhf libxi-dev:armhf libgl-dev:armhf libwayland-dev:armhf libpulse-dev:armhf libxkbcommon-dev:armhf libegl-dev:armhf libasound2-dev:armhf
    - name: Build
      run: |
        mkdir -p build-arm
        cd build-arm
        cmake -DCMAKE_TOOLCHAIN_FILE=../cmake/arm_toolchain.cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        make -j$(nproc)
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ninecraft-linux-armhf
        path: build-arm/ninecraft/ninecraft

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install jinja2
    - name: Configure CMake
      run: cmake -B ${{ github.workspace }}/build -A Win32 -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DPython_EXECUTABLE=${{ env.pythonLocation }}/python.exe -DPython_ROOT_DIR=${{ env.pythonLocation }} -DPython3_EXECUTABLE=${{ env.pythonLocation }}/python.exe
    - name: Build
      run: cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }}
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ninecraft-windows-Win32
        path: build/ninecraft/${{ env.BUILD_TYPE }}/ninecraft.exe
